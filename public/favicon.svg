<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">

  <!-- Dark navy background — full square, no rounding -->
  <rect width="32" height="32" fill="#1a1a2e"/>

  <!-- "LD" monogram — centered, white, bold IBM Plex Mono -->
  <!-- text-anchor="middle"     → horizontally centered on x=16  -->
  <!-- dominant-baseline="central" → vertically centered on y=16 -->
  <text
    x="16"
    y="16"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-size="14"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#ffffff"
  >LD</text>

</svg>
